name: Publish Packages

on:
  push:
    branches: [main]
    # No `paths:` filter, deliberately. There is ONE question here — "does npmjs
    # serve something older than this tree?" — and the plan job answers it
    # against the registry itself. A path gate in front of it is a second, worse
    # answer to the same question: it guesses from the shape of a diff, and
    # anything that can veto the job before the registry comparison runs is a way
    # to lose a release. With one gate, and that gate reading the registry,
    # publishing whatever is ahead of npmjs is idempotent by construction — the
    # same property that makes the manual dispatch below safe.
  workflow_dispatch:

# NO WORKFLOW-WIDE GROUP. Each run publishes whatever is ahead of npmjs, and
# each package's publish holds a group of its own (the job below), so two runs
# never race one package while a release of one package never queues behind
# another's suite. That queue was the lane's floor: one job built, tested and
# published every changed package in turn.

# The publish job reads its package's test legs from this run.
permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: linux-amd64
    outputs:
      released: ${{ steps.plan.outputs.released }}
      legs: ${{ steps.plan.outputs.legs }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        uses: ./.github/actions/plan
        with:
          lane: publish

  # Each released package's legs (test.yml), and nothing cancels them: the gate
  # leaves these suites to this run.
  test:
    needs: plan
    if: needs.plan.outputs.legs != '[]'
    uses: ./.github/workflows/test.yml
    with:
      legs: ${{ needs.plan.outputs.legs }}
    secrets: inherit

  publish:
    needs: plan
    if: needs.plan.outputs.released != '[]'
    name: publish ${{ matrix.package }}
    runs-on: linux-amd64
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.plan.outputs.released) }}
    # One publish of a package at a time, and never cancelled: a version is
    # immutable, and the next run republishes whatever npmjs still lacks.
    concurrency:
      group: publish-${{ matrix.package }}
      cancel-in-progress: false
    env:
      PKG: ${{ matrix.package }}
    steps:
      - name: One package per leg
        run: |
          [[ $PKG =~ ^@hanzo/[a-z0-9._-]+$ ]] || {
            echo "::error::this leg was handed '$PKG', not one package: the matrix was not expanded"; exit 1; }

      - uses: actions/checkout@v4

      - uses: ./.github/actions/pnpm
        with:
          kms-client-id: ${{ secrets.KMS_CLIENT_ID }}
          kms-client-secret: ${{ secrets.KMS_CLIENT_SECRET }}

      - name: Build
        run: |
          set -euo pipefail
          # The trailing `...` builds the workspace dependencies first (test.yml
          # says why). The typecheck ran in the package's first leg.
          pnpm --filter "$PKG"... build
          DIR=$(pnpm --filter "$PKG" exec pwd | tail -1)
          [ -n "$DIR" ] || { echo "::error::$PKG matched no workspace package"; exit 1; }
          # `types` is a PROMISE to every consumer, and the declaration build is a
          # separate pass — so a failure there yields a package whose JS is fine
          # and whose types are absent, which surfaces in dependents as "Could not
          # find a declaration file".
          TYPES=$(jq -r '.types // .typings // empty' "$DIR/package.json")
          if [ -n "$TYPES" ] && [ ! -f "$DIR/$TYPES" ]; then
            echo "::error::$PKG declares types at $TYPES but the build produced no such file."
            exit 1
          fi
          echo "DIR=$DIR" >> "$GITHUB_ENV"

      - name: This package's legs
        id: mine
        env:
          LEGS: ${{ needs.plan.outputs.legs }}
        run: echo "legs=$(jq -c --arg p "$PKG" '[.[] | select(.name == $p)]' <<<"$LEGS")" >> "$GITHUB_OUTPUT"

      # The build ran beside the tests; the publish waits for this package's
      # legs and no other package's, and goes only if every one passed.
      - name: Wait for this package's tests
        uses: ./.github/actions/wait
        with:
          legs: ${{ steps.mine.outputs.legs }}
          token: ${{ github.token }}

      # A `workspace:` dependency packs as its local version, so a package this
      # run also releases has to be on npmjs first or this one ships pointing at
      # a version nobody can install. Only that wait crosses packages: any other
      # workspace dependency is not ahead of npmjs, so npmjs already serves it.
      - name: Its workspace dependencies are released
        env:
          RELEASED: ${{ needs.plan.outputs.released }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          deps=$(jq -c --argjson r "$RELEASED" '[.dependencies, .peerDependencies, .optionalDependencies]
            | map(select(.) | to_entries[] | select(.value | startswith("workspace:")) | .key) | unique
            | map(select(. as $d | $r | index($d)))' "$DIR/package.json")
          [ "$deps" = '[]' ] && exit 0
          url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100"
          for _ in $(seq 1 120); do
            got=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url" \
              | jq -c --argjson d "$deps" '[.jobs[] | select(.name | startswith("publish ")) | select(.name[8:] as $n | $d | index($n)) | {name, status, conclusion}]') || got='[]'
            bad=$(jq -r '[.[] | select(.status == "completed" and .conclusion != "success") | .name] | join(", ")' <<<"$got")
            [ -z "$bad" ] || { echo "::error::$PKG does not publish: $bad did not"; exit 1; }
            [ "$(jq '[.[] | select(.conclusion == "success")] | length' <<<"$got")" -ge "$(jq length <<<"$deps")" ] && { echo "released first: $deps"; exit 0; }
            sleep 5
          done
          echo "::error::$PKG: $deps did not publish within 10 minutes"; exit 1

      # Read once this job has built and run its tests, so no package script runs
      # while the token exists.
      - name: Fetch the npm token from KMS
        id: npmtok
        # publish.yml used secrets.NPM_TOKEN, which exists on NEITHER the hanzoai
        # org nor this repo on git.hanzo.ai. An absent secret interpolates to the
        # empty string rather than failing, so every publish reached npmjs
        # unauthenticated and 401'd -- the reason @hanzo/ui has never shipped from
        # CI and each release was a hand publish.
        #
        # KMS is where a secret lives, so the token is read at run time from the
        # same org path and with the same machine identity every other workflow
        # here already uses. Nothing new to rotate, and no npm credential is
        # stored on Hanzo Git.
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          KMS_ORG: ${{ vars.KMS_ORG || 'hanzo' }}
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
          # Where the token actually lives, MEASURED: NPM_TOKEN sits at the org
          # root, not under deploy/ (which holds CLOUDFLARE_*, GIT_TOKEN,
          # KUBECONFIG, UNIVERSE_PIN_TOKEN). Empty means root; set the
          # KMS_NPM_PATH variable to move it without editing this file.
          KMS_NPM_PATH: ${{ vars.KMS_NPM_PATH || '' }}
        run: |
          # The body is interpolated, not built with `jq -n`: this runner's jq
          # answers that form with `parse error: Invalid numeric literal`, an
          # error about INPUT from a call that reads none.
          body="{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}"
          # NO -f, and no pipe into jq: capture the status AND the body, then say
          # which was wrong, so a KMS answer that is not JSON names itself.
          out=$(curl -sS -w '\n%{http_code}' "${KMS_ENDPOINT}/v1/kms/auth/login" \
                  -H 'Content-Type: application/json' --data-binary "$body")
          code=${out##*$'\n'}
          resp=${out%$'\n'*}
          if [ "$code" != "200" ]; then
            echo "::error::KMS login returned HTTP $code at ${KMS_ENDPOINT}: $(printf '%s' "$resp" | head -c 200)"
            exit 1
          fi
          token=$(printf '%s' "$resp" | jq -r '.accessToken // empty' 2>/dev/null || true)
          if [ -z "${token}" ]; then
            echo "::error::KMS login was 200 but carried no accessToken: $(printf '%s' "$resp" | head -c 200)"
            exit 1
          fi
          # The read is org-scoped by the TOKEN's owner claim, not by a path
          # segment: the flat form is the contract cloud's embedded KMS serves,
          # and it answers {name, env, value}.
          secret_url="${KMS_ENDPOINT}/v1/kms/secrets/${KMS_NPM_PATH:+${KMS_NPM_PATH}/}NPM_TOKEN?env=${KMS_SECRET_ENV}"
          # Retried, and ONLY on 5xx: a gateway timeout (524) is transient and
          # must not cost a release; a 401/403/404 is a real answer.
          for attempt in 1 2 3 4 5; do
            out=$(curl -sS -w '\n%{http_code}' "${secret_url}" -H "Authorization: Bearer ${token}")
            code=${out##*$'\n'}
            resp=${out%$'\n'*}
            case "$code" in
              200) break ;;
              5*)  echo "KMS secret read HTTP $code (attempt $attempt/5); waiting 15s"; sleep 15 ;;
              *)   break ;;
            esac
          done
          if [ "$code" != "200" ]; then
            echo "::error::KMS secret read returned HTTP $code at ${secret_url}: $(printf '%s' "$resp" | head -c 200)"
            exit 1
          fi
          npm_token=$(printf '%s' "$resp" | jq -r '.value // empty' 2>/dev/null || true)
          if [ -z "${npm_token}" ]; then
            echo "::error::No NPM_TOKEN at ${secret_url} (HTTP 200, body: $(printf '%s' "$resp" | head -c 200))."
            echo "::error::Put it there, or set the KMS_NPM_PATH variable to the path that has it."
            exit 1
          fi
          # Masked before it is ever an output, so it cannot surface in a log.
          echo "::add-mask::${npm_token}"
          echo "token=${npm_token}" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ steps.npmtok.outputs.token }}
          HANZO_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          NAME=$(jq -r '.name' "$DIR/package.json")
          WANT=$(jq -r '.version' "$DIR/package.json")

          # Has this package EVER been released? A first release is not readable
          # within the window below, and treating that as a failure sends the next
          # person to burn a version number over it.
          FIRST=
          curl -fsS "https://registry.npmjs.org/$(printf %s "$NAME" | sed 's|/|%2F|')" \
            >/dev/null 2>&1 || FIRST=1

          # The guard runs here, by name, and the publish runs no scripts: the
          # build above is what ships, and `prepack` would rebuild it (four
          # minutes for @hanzo/ui) inside the publish.
          pnpm --filter "$PKG" run --if-present prepublishOnly || exit 1

          # Idempotent on purpose: the desired state is "npmjs holds this
          # version", and a version already there satisfies it. Versions are
          # immutable, so a conflict means the release already happened.
          OUT=$(pnpm --filter "$PKG" publish --no-git-checks --ignore-scripts --access public 2>&1)
          PUB=$?
          echo "$OUT"
          case "$OUT" in
            *EPUBLISHCONFLICT*|*"cannot publish over"*|*"Cannot publish over"*|*"previously published versions"*)
              echo "::notice::$PKG is already on npmjs at this version — nothing to do" ;;
            *)
              # A PUBLISH THAT EXITED 0 IS A RELEASE: npmjs answered the upload
              # with success, and then serves the version in its own time —
              # measured at two to seven minutes (@hanzo/dashboard 0.2.2 and
              # @hanzo/tokens 1.1.0 about two, @hanzo/ui 8.28.0 seven, its
              # registry time 17:02:01 against a 16:55 publish), which this job
              # used to sit out on every release. A publish that did NOT exit 0
              # is the ambiguous case — a first release that 403s looks like one
              # that is propagating — so that one is read off the registry,
              # through its own version document, before it is called either.
              if [ "$PUB" -eq 0 ]; then
                echo "published $NAME@$WANT (npmjs accepted it; it serves it within minutes)"
              else
                landed=
                for attempt in $(seq 1 90); do
                  if curl -fsS -o /dev/null "https://registry.npmjs.org/$NAME/$WANT" 2>/dev/null; then landed=1; break; fi
                  echo "$NAME@$WANT not visible to npmjs yet (attempt $attempt/90); waiting 10s"
                  sleep 10
                done
                if [ -z "$landed" ]; then
                  echo "::error::$NAME@$WANT: publish exited $PUB and the ${FIRST:+first }version is not on npmjs"
                  exit 1
                fi
                echo "published $NAME@$WANT"
              fi ;;
          esac

          # Second home for the same tarball: our own registry, so an install
          # does not have to reach npmjs. BEST-EFFORT by construction — no token
          # means a notice, and npmjs stays authoritative either way.
          if [ -z "${HANZO_REGISTRY_TOKEN:-}" ]; then
            echo "::notice::REGISTRY_TOKEN not set — $PKG published to npmjs only."
            exit 0
          fi
          REG=https://api.hanzo.ai/v1/packages/hanzo/npm/
          NPMRC="$RUNNER_TEMP/.npmrc-hanzo"
          {
            echo "@hanzo:registry=${REG}"
            echo "//api.hanzo.ai/v1/packages/hanzo/npm/:_authToken=${HANZO_REGISTRY_TOKEN}"
          } > "$NPMRC"
          out=$(npm_config_userconfig="$NPMRC" \
                pnpm --filter "$PKG" publish \
                  --no-git-checks --ignore-scripts --access public --registry "$REG" 2>&1) || true
          echo "$out"
          case "$out" in
            *EPUBLISHCONFLICT*|*"cannot publish over"*|*"already exists"*)
              echo "::notice::$PKG already in the Hanzo registry at this version" ;;
            *) echo "$out" | grep -qiE 'error|failed' \
                 && echo "::warning::mirror of $PKG to api.hanzo.ai failed (npmjs publish unaffected)" \
                 || echo "mirrored $PKG to the Hanzo registry" ;;
          esac
