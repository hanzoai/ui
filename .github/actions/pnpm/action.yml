name: pnpm workspace
description: >-
  pnpm at the version this repo pins, Node from the runner's tool cache, and
  `pnpm install --frozen-lockfile`, which lays node_modules out from the
  lockfile, with the verdict of the lockfile's supply-chain check carried from
  the run that reached it. Every job that installs the workspace starts here.
inputs:
  kms-client-id:
    required: true
  kms-client-secret:
    required: true
  save:
    description: "'true' writes the verdict back on a miss. One job of a run saves, so legs never race one key."
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    # 22, the major the runner image carries in its tool cache, so this resolves
    # in a second instead of downloading Node for 40. pnpm 11 imports
    # node:sqlite, which Node 22 serves.
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        registry-url: 'https://registry.npmjs.org'

    # pnpm 11 checks the lockfile against its supply-chain policies before an
    # install, fetching a packument per entry from npmjs: 16 s to 1 m 43 s a
    # job, measured. It records each lockfile that passed in its metadata cache
    # (lockfile-verified.jsonl, keyed by the lockfile's content and the policy),
    # and an install that finds the record skips the fetch. That record is what
    # travels, under the lockfile's hash; only the default branch writes it.
    #
    # Not node_modules and not the store. A restored node_modules is a layout
    # pnpm trusts without relinking, so its hoisting is whatever the saving
    # install chose (one hoisted the react-native 0.86.2 copy of @hanzo/gui, and
    # tsc typed @hanzo/ui against it). The store is 552 MiB that took 275 s to
    # save, against an install that downloads it in about a minute.
    - name: Locate pnpm's metadata cache
      id: where
      shell: bash
      run: |
        {
          echo "name=pnpm-verified-$(pnpm --version)"
          echo "key=$(git ls-tree HEAD -- pnpm-lock.yaml | sha256sum | cut -c1-32)"
          echo "cache=$(pnpm cache path)"
          echo "carry=$RUNNER_TEMP/pnpm-verified"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the lockfile verdict (this org's store)
      id: cache
      uses: ./.github/actions/cache
      with:
        kms-client-id: ${{ inputs.kms-client-id }}
        kms-client-secret: ${{ inputs.kms-client-secret }}
        command: restore
        name: ${{ steps.where.outputs.name }}
        key: ${{ steps.where.outputs.key }}
        dirs: verified=${{ steps.where.outputs.carry }}

    - name: Install dependencies
      shell: bash
      env:
        CACHE: ${{ steps.where.outputs.cache }}
        CARRY: ${{ steps.where.outputs.carry }}
      run: |
        if [ -f "$CARRY/lockfile-verified.jsonl" ]; then
          mkdir -p "$CACHE" && cp "$CARRY/lockfile-verified.jsonl" "$CACHE/"
        fi
        pnpm install --frozen-lockfile

    - name: Keep the lockfile verdict
      if: inputs.save == 'true' && steps.cache.outputs.hit != 'exact'
      shell: bash
      env:
        CACHE: ${{ steps.where.outputs.cache }}
        CARRY: ${{ steps.where.outputs.carry }}
      run: mkdir -p "$CARRY" && cp "$CACHE/lockfile-verified.jsonl" "$CARRY/" 2>/dev/null || true

    - name: Save the lockfile verdict (this org's store)
      if: inputs.save == 'true' && steps.cache.outputs.hit != 'exact'
      uses: ./.github/actions/cache
      with:
        kms-client-id: ${{ inputs.kms-client-id }}
        kms-client-secret: ${{ inputs.kms-client-secret }}
        command: save
        name: ${{ steps.where.outputs.name }}
        key: ${{ steps.where.outputs.key }}
        dirs: verified=${{ steps.where.outputs.carry }}
