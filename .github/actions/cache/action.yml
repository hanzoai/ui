name: org cache
description: >-
  Restore or save directories through this org's store (hanzoai/ci bin/cache):
  the org's own bucket in cloud's object store, reached with the IAM token the
  KMS pair mints. An accelerator: nothing here fails a job, and only the default
  branch writes.
inputs:
  kms-client-id:
    required: true
  kms-client-secret:
    required: true
  command:
    description: "'restore' or 'save'"
    required: true
  name:
    description: What an archive is valid for (a tool version and the architecture).
    required: true
  key:
    description: The hash of what decides its contents.
    required: true
  dirs:
    description: "Space-separated <label>=<dir> pairs."
    required: true
outputs:
  hit:
    description: "exact, partial or miss (restore only)"
    value: ${{ steps.run.outputs.hit }}
runs:
  using: composite
  steps:
    # The IAM token goes to bin/cache alone, never to GITHUB_ENV: the build runs
    # every package's scripts.
    - id: run
      shell: bash
      env:
        KMS_CLIENT_ID: ${{ inputs.kms-client-id }}
        KMS_CLIENT_SECRET: ${{ inputs.kms-client-secret }}
        CI_SHA: c07458b2b77a46a79402f174dc70358e426dcf38
        COMMAND: ${{ inputs.command }}
        NAME: ${{ inputs.name }}
        KEY: ${{ inputs.key }}
        DIRS: ${{ inputs.dirs }}
      run: |
        set +e
        set -uo pipefail
        bin="$RUNNER_TEMP/bin-cache"
        if [ ! -x "$bin" ]; then
          curl -fsSL -m 60 "https://raw.githubusercontent.com/hanzoai/ci/$CI_SHA/bin/cache" -o "$bin" && chmod +x "$bin" \
            || { echo "::notice::hanzoai/ci@$CI_SHA bin/cache did not download, so nothing is carried"; echo "hit=miss" >> "$GITHUB_OUTPUT"; exit 0; }
        fi
        T=$(printf '{"clientId":"%s","clientSecret":"%s"}' "$KMS_CLIENT_ID" "$KMS_CLIENT_SECRET" \
          | curl -sS -m 30 https://api.hanzo.ai/v1/kms/auth/login -H 'Content-Type: application/json' -d @- \
          | jq -r '.accessToken // empty' 2>/dev/null)
        if [ -n "$T" ]; then echo "::add-mask::$T"; else echo "::notice::KMS gave no IAM token, so the org store is not used"; fi
        # shellcheck disable=SC2086 # DIRS is a list of label=dir words
        HANZO_API_TOKEN=$T "$bin" "$COMMAND" "$NAME" "$KEY" $DIRS || echo "::notice::cache $COMMAND $NAME did not complete"
