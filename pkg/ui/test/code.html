<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@hanzo/ui code</title>
    <style>
      /* The docs site's rule for a shiki block (apps/ui.hanzo.ai/app.css): shiki
         states a token's slant and weight as custom properties, the same in both
         schemes, and the span reads them. */
      .code { margin: 0; padding: 16px; border-radius: 8px; overflow-x: auto; font-family: var(--font-mono); font-size: 13px; line-height: 1.6 }
      .code span { font-style: var(--shiki-dark-font-style); font-weight: var(--shiki-dark-font-weight) }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.process = { env: { NODE_ENV: 'development' } }
      // The page as a host would set it: its direction and language on <html>.
      var q = new URLSearchParams(location.search)
      if (q.get('dir') === 'rtl') { document.documentElement.dir = 'rtl'; document.documentElement.lang = 'ar' }
    </script>
    <script type="module" src="/test/code.mount.tsx"></script>
  </body>
</html>
