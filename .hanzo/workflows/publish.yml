name: Publish Packages

on:
  push:
    branches: [main]
    # No `paths:` filter, deliberately. There is ONE question here — "does npmjs
    # serve something older than this tree?" — and detect-changes already answers
    # it against the registry itself. A path gate in front of it is a second,
    # WORSE answer to the same question: it guesses from the shape of a diff.
    #
    # It guessed wrong twice, in opposite directions. Matching `pkgs/*` only made
    # every `pkg/*` package unreachable, and @hanzo/ui 8.0.29 sat unpublished
    # while npmjs served 8.0.28 — consumers on `^8.0.17` silently resolved a
    # version with no `./chat` entrypoint. Adding `pkg/*` fixed that case and
    # left the shape intact, so the second one landed anyway: 8.0.72 bumped
    # cleanly, the run failed on a stale lockfile, and the lockfile-only FIX
    # then matched no path and could not re-run the job it repaired.
    #
    # Both are the same defect. A version reaches users through the registry
    # comparison, so anything that can veto the job before that comparison runs
    # is a way to lose a release. Deleting the gate leaves exactly one, and it
    # is the one that reads the truth: detect-changes publishes whatever is
    # ahead of npmjs and nothing when nothing is, so running it on every push to
    # main is idempotent by construction — the same property that makes the
    # manual dispatch below safe.
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: hanzo-build-linux-amd64
    outputs:
      packages: ${{ steps.changed.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed packages
        id: changed
        run: |
          CHANGED=()
          # Both package roots. `@hanzo/ui` and `@hanzo/data` live under pkg/ (singular)
          # and were invisible to a `pkgs/*` glob, so no version bump of either could
          # ever reach npmjs from here.
          for pkg_json in pkg/*/package.json pkgs/*/package.json; do
            [ ! -f "$pkg_json" ] && continue
            # Skip private packages
            IS_PRIVATE=$(jq -r '.private // false' "$pkg_json")
            [ "$IS_PRIVATE" = "true" ] && continue

            # Only publish @hanzo/* packages
            PKG_NAME=$(jq -r '.name' "$pkg_json")
            case "$PKG_NAME" in
              @hanzo/*) ;;
              *) continue ;;
            esac

            # What npm SERVES, not what the previous commit said. HEAD~1 is the
            # FIRST PARENT, so a merge whose first parent is the feature branch
            # already carries the new version and the diff is empty — the publish
            # is skipped and npm keeps serving the old release, silently. Asking
            # the registry is independent of merge topology and of how many
            # commits the runner fetched.
            NEW=$(jq -r '.version' "$pkg_json")
            OLD=$(curl -sf "https://registry.npmjs.org/${PKG_NAME}" \
                    | jq -r '."dist-tags".latest // "0.0.0"' 2>/dev/null || echo "0.0.0")

            # FORWARD ONLY. `!=` fires in both directions, and several packages
            # sit BEHIND npm (a release cut elsewhere, a revert) — publishing
            # those walks the registry backwards. Only a strictly greater local
            # version is a release.
            NEWEST=$(printf '%s\n%s\n' "$OLD" "$NEW" | sort -V | tail -1)
            if [ "$OLD" != "$NEW" ] && [ "$NEWEST" = "$NEW" ]; then
              echo "Version change: $PKG_NAME ($OLD -> $NEW)"
              # The package NAME, because every downstream step spends this as a
              # `pnpm --filter` argument and a directory basename matches nothing.
              # An unmatched filter exits 0, so the build silently no-ops and the
              # publish ships an unbuilt tarball — how 8.0.17 and 8.0.19 shipped broken.
              CHANGED+=("$PKG_NAME")
            fi
          done

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "packages=[]" >> $GITHUB_OUTPUT
          else
            JSON=$(printf '%s\n' "${CHANGED[@]}" | jq -R . | jq -s -c .)
            echo "packages=$JSON" >> $GITHUB_OUTPUT
          fi

  publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: hanzo-build-linux-amd64
    # NO MATRIX, and that is the whole point of this job's shape.
    #
    # This was `strategy.matrix.package: ${{ fromJson(…) }}`, and Hanzo Git
    # runner does not expand a dynamic matrix. With more than one package it
    # produced ONE job literally named `publish (${{ fromJson(…) }})` — the log
    # says `Cleaning up network for job publish (Array)` — and `matrix.package`
    # interpolated to the WHOLE ARRAY. `pnpm --filter '["@hanzo/a","@hanzo/b"]'`
    # matches nothing, an unmatched filter exits 0, so one package won and the
    # rest silently did not ship. With exactly one package it works, which is
    # why it read as intermittent rather than broken. It cost a real release:
    # @hanzo/ui@8.0.69 published while @hanzo/appearance did not, and nothing
    # anywhere said so.
    #
    # So the list is read HERE, in one job, and looped. `hanzoai/design`'s
    # publish.yml has no matrix and has never lost a release; this is that shape
    # with more than one package to place. The loop keeps what `fail-fast: false`
    # bought — a broken package must not withhold anyone else's release — by
    # recording each failure and failing the job once, at the end.
    env:
      PACKAGES: ${{ needs.detect-changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Fetch the npm token from KMS
        id: npmtok
        # publish.yml used secrets.NPM_TOKEN, which exists on NEITHER the hanzoai
        # org nor this repo on git.hanzo.ai. An absent secret interpolates to the
        # empty string rather than failing, so every publish reached npmjs
        # unauthenticated and 401'd -- the reason @hanzo/ui has never shipped from
        # CI and each release was a hand publish.
        #
        # KMS is where a secret lives, so the token is read at run time from the
        # same org path and with the same machine identity every other workflow
        # here already uses. Nothing new to rotate, and no npm credential is
        # stored on Hanzo Git.
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          KMS_ORG: ${{ vars.KMS_ORG || 'hanzo' }}
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
          # Where the token actually lives, MEASURED: NPM_TOKEN sits at the org
          # root, not under deploy/ (which holds CLOUDFLARE_*, GIT_TOKEN,
          # KUBECONFIG, UNIVERSE_PIN_TOKEN). Empty means root; set the
          # KMS_NPM_PATH variable to move it without editing this file.
          KMS_NPM_PATH: ${{ vars.KMS_NPM_PATH || '' }}
        run: |
          token=$(curl -fsS "${KMS_ENDPOINT}/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken // empty')
          if [ -z "${token}" ]; then
            echo "::error::KMS login failed at ${KMS_ENDPOINT}/v1/kms/auth/login (check KMS_CLIENT_ID/KMS_CLIENT_SECRET)."
            exit 1
          fi
          # The read is org-scoped by the TOKEN's owner claim, not by a path
          # segment: the flat form is the contract cloud's embedded KMS serves,
          # and it answers {name, env, value}. The older
          # /v1/kms/orgs/<org>/secrets/... form with .secret.value 404s here.
          secret_url="${KMS_ENDPOINT}/v1/kms/secrets/${KMS_NPM_PATH:+${KMS_NPM_PATH}/}NPM_TOKEN?env=${KMS_SECRET_ENV}"
          # No -f: a 404 must report WHICH path was empty, not just exit 22.
          npm_token=$(curl -sS "${secret_url}" -H "Authorization: Bearer ${token}" | jq -r '.value // empty')
          if [ -z "${npm_token}" ]; then
            echo "::error::No NPM_TOKEN at ${secret_url}."
            echo "::error::Put it there, or set the KMS_NPM_PATH variable to the path that has it."
            exit 1
          fi
          # Masked before it is ever an output, so it cannot surface in a log.
          echo "::add-mask::${npm_token}"
          echo "token=${npm_token}" >> "$GITHUB_OUTPUT"

      - name: Release each changed package
        # Everything per-package happens HERE, in one loop, because the runner
        # cannot expand a matrix (see the note on the job). `::group::` keeps a
        # package's build, test and publish readable as its own section.
        #
        # A failure is RECORDED and the loop continues, so one broken package
        # cannot withhold every other package's release — what `fail-fast: false`
        # used to buy. The job fails once at the end, naming every package that
        # did not ship.
        env:
          NODE_AUTH_TOKEN: ${{ steps.npmtok.outputs.token }}
          HANZO_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          FAILED=()

          release() {
            PKG="$1"

            # The trailing `...` is load-bearing: it builds the package's
            # WORKSPACE DEPENDENCIES first, in topological order. Without it,
            # `pnpm --filter @hanzo/ui build` runs alone against siblings that
            # have no `dist/`. Those siblings type themselves through
            # `"types": "dist/index.d.ts"`, so tsc reports them as missing
            # modules and the errors do not name the real cause:
            #   src/product/SiteNav.tsx: Cannot find module '@hanzo/products'
            #   src/core/tokens.ts:      Cannot find module '@hanzo/tokens'
            # plus a wave of implicit-any errors in the files that imported
            # them, which read like a source problem in @hanzo/ui and are not.
            pnpm --filter "$PKG"... build || return 1

            PKG_DIR=$(pnpm --filter "$PKG" exec pwd | tail -1)
            [ -n "$PKG_DIR" ] || { echo "::error::$PKG matched no workspace package"; return 1; }

            # bun, only for a package whose own test script asks for it.
            # @hanzo/canvas declares `bun test` and this runner has no bun, so
            # its suite was `spawn ENOENT` on every run — the step that exists to
            # stop an untested release was itself stopping the release. Read from
            # the package's OWN manifest so adopting or dropping bun needs no
            # edit here, and a package that does not ask for it does not pay.
            if jq -r '.scripts.test // ""' "$PKG_DIR/package.json" | grep -qw bun; then
              if ! command -v bun >/dev/null 2>&1; then
                # From npmjs, not bun.sh/install: this job already reaches the
                # npm registry and setup-node already put the global bin on
                # PATH, so this adds no new host to trust. The shell installer
                # would also want unzip, which a minimal runner need not carry.
                npm install -g bun || return 1
              fi
              bun --version
            fi

            # A published version is IMMUTABLE, so this is the last point at
            # which a defect costs nothing. `--if-present` so a package with no
            # test script is skipped rather than failing the release.
            pnpm --filter "$PKG" run --if-present test || return 1

            # `types` is a PROMISE to every consumer, and the declaration build
            # is a separate pass — so a failure there yields a package whose JS
            # is fine and whose types are absent. Invisible here, and it surfaces
            # in dependents as "Could not find a declaration file".
            TYPES=$(jq -r '.types // .typings // empty' "$PKG_DIR/package.json")
            if [ -n "$TYPES" ] && [ ! -f "$PKG_DIR/$TYPES" ]; then
              echo "::error::$PKG declares types at $TYPES but the build produced no such file."
              echo "::error::Publishing would ship a package that silently has no types."
              return 1
            fi

            NAME=$(jq -r '.name' "$PKG_DIR/package.json")
            WANT=$(jq -r '.version' "$PKG_DIR/package.json")

            # Has this package EVER been released? A first release is not
            # readable within the window below, and treating that as a failure
            # sends the next person to burn a version number over it.
            FIRST=
            curl -fsS "https://registry.npmjs.org/$(printf %s "$NAME" | sed 's|/|%2F|')" \
              >/dev/null 2>&1 || FIRST=1

            # Idempotent on purpose: the desired state is "npmjs holds this
            # version", and a version already there satisfies it. Versions are
            # immutable, so a conflict means the release already happened.
            OUT=$(pnpm --filter "$PKG" publish --no-git-checks --access public 2>&1)
            PUB=$?
            echo "$OUT"
            case "$OUT" in
              *EPUBLISHCONFLICT*|*"cannot publish over"*|*"previously published versions"*)
                echo "::notice::$PKG is already on npmjs at this version — nothing to do" ;;
              *)
                # RETRIED, because npmjs is read-after-write eventually
                # consistent. On run 26906 two packages failed here having
                # printed npm's own success line moments earlier, and both were
                # on the registry: the publishes worked and the check was early.
                # A false red is worse than a slow green — it reports a release
                # that did happen as failed, and the next person bumps the
                # version to "fix" it.
                landed=
                for attempt in 1 2 3 4 5 6; do
                  if npm view "$NAME@$WANT" version >/dev/null 2>&1; then landed=1; break; fi
                  echo "$NAME@$WANT not visible to npmjs yet (attempt $attempt/6); waiting 10s"
                  sleep 10
                done
                if [ -n "$landed" ]; then
                  echo "published $NAME@$WANT"
                elif [ "$PUB" -ne 0 ]; then
                  # The PUBLISH ITSELF failed. Leniency below is about the
                  # registry being slow to SERVE a release that happened; it is
                  # not about one that did not. Reading only the registry cannot
                  # tell those apart, and a first release that 403s looks exactly
                  # like a first release that is propagating — which is how
                  # @hanzo/next and @hanzo/vite reported a GREEN publish while
                  # npmjs answered 404 for both.
                  echo "::error::$NAME@$WANT: publish exited $PUB and the version is not on npmjs"
                  return 1
                elif [ -n "$FIRST" ]; then
                  # Publish reported success and this name is new to npmjs, which
                  # takes longer to become readable than one it already serves.
                  # A false red here burns a version number over propagation.
                  echo "::warning::$NAME@$WANT published but is not readable yet (first release) — confirm on the registry before re-running; republishing the same version 403s."
                else
                  echo "::error::$NAME@$WANT is not on npmjs 60s after publish"
                  return 1
                fi ;;
            esac

            # Second home for the same tarball: our own registry, so an install
            # does not have to reach npmjs. BEST-EFFORT by construction — no
            # token means a notice, and npmjs stays authoritative either way.
            if [ -z "${HANZO_REGISTRY_TOKEN:-}" ]; then
              echo "::notice::REGISTRY_TOKEN not set — $PKG published to npmjs only."
              return 0
            fi
            REG=https://api.hanzo.ai/v1/packages/hanzo/npm/
            NPMRC="$RUNNER_TEMP/.npmrc-hanzo"
            {
              echo "@hanzo:registry=${REG}"
              echo "//api.hanzo.ai/v1/packages/hanzo/npm/:_authToken=${HANZO_REGISTRY_TOKEN}"
            } > "$NPMRC"
            out=$(npm_config_userconfig="$NPMRC" \
                  pnpm --filter "$PKG" publish \
                    --no-git-checks --access public --registry "$REG" 2>&1) || true
            echo "$out"
            case "$out" in
              *EPUBLISHCONFLICT*|*"cannot publish over"*|*"already exists"*)
                echo "::notice::$PKG already in the Hanzo registry at this version" ;;
              *) echo "$out" | grep -qiE 'error|failed' \
                   && echo "::warning::mirror of $PKG to api.hanzo.ai failed (npmjs publish unaffected)" \
                   || echo "mirrored $PKG to the Hanzo registry" ;;
            esac
            return 0
          }

          # The list, read here rather than expanded into jobs.
          mapfile -t PKGS < <(printf '%s' "$PACKAGES" | jq -r '.[]')
          echo "releasing ${#PKGS[@]} package(s): ${PKGS[*]}"

          for PKG in "${PKGS[@]}"; do
            echo "::group::$PKG"
            if release "$PKG"; then
              echo "$PKG ok"
            else
              echo "::error::$PKG did not ship"
              FAILED+=("$PKG")
            fi
            echo "::endgroup::"
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::these packages did not ship: ${FAILED[*]}"
            exit 1
          fi
          echo "all ${#PKGS[@]} package(s) released"
