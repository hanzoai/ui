name: deploy

# Builds ui.hanzo.ai and publishes the image the operator runs.
#
# The site was already on our own stack — hanzoai/static behind hanzoai/ingress,
# with crs/ui.yaml in hanzoai/universe naming the live tag — but no workflow ever
# built the image: every tag in ghcr.io/hanzoai/ui up to v5.7.6 was pushed by
# hand. This is that missing step, so a commit on main produces a candidate tag
# without anyone reaching for docker locally.
#
# The image tag is the run's commit, and the CR names which tag is live: a build
# never deploys itself.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'pkg/ui/**'
      - 'pkgs/event/**'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
      - '.hanzo/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: build and push
        # GHCR_TOKEN/GHCR_USER, which are the org secrets that actually exist.
        # This job asked for REGISTRY_TOKEN, which was never defined anywhere —
        # the org has exactly GHCR_TOKEN, GHCR_USER, GH_PAT, KMS_CLIENT_ID,
        # KMS_CLIENT_SECRET, OCI_TOKEN, OCI_USER — so the guard below fired on
        # every run and nothing was ever published. Every other image build in
        # the org already uses the GHCR_* pair; this file and papers were the
        # two that invented a name.
        #
        # The username comes from the secret too, rather than being hardcoded to
        # hanzo-dev, so rotating the publishing identity is one org-level change.
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_TOKEN:-}" ] || [ -z "${GHCR_USER:-}" ]; then
            echo "::error::GHCR_TOKEN/GHCR_USER are unset, so nothing was published."
            exit 1
          fi
          tag="$(git rev-parse --short HEAD)"
          image="ghcr.io/hanzoai/ui:${tag}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker build -t "${image}" .
          docker push "${image}"
          echo "published ${image} — set spec.image.tag in universe crs/ui.yaml to ${tag}"
