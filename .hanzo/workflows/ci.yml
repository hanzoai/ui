name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: hanzo-build-linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run linting
        run: pnpm run lint

  typecheck:
    name: Type Check
    runs-on: hanzo-build-linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Build everything app/ DEPENDS ON, not one hardcoded package. `^...` is
      # turbo's "dependencies of, excluding itself" filter, so the set is derived
      # from the workspace graph and stays right when an import is added.
      #
      # Building only pkg/ui was why `Cannot find module '@hanzo/event'` failed
      # here and nowhere else: @hanzo/event resolves to the workspace copy, whose
      # package.json points types at ./dist/index.d.ts, and nothing built it.
      # Reproduce locally by moving pkgs/event/dist aside — the same one error.
      # This job typechecks app AND pkg/ui, so build what BOTH depend on. With
      # only app's set built, @hanzo/data stayed unbuilt: its exports name
      # ./types/index.d.ts, nothing produced it, and Bundler resolution fell
      # through to ./src/index.ts — so pkg/ui typechecked 90 errors' worth of
      # another package's source.
      - name: Build the workspace dependencies of app and pkg/ui
        run: pnpm turbo run build --filter='@hanzo/ui-web^...' --filter='@hanzo/ui^...'

      - name: Run type checking
        run: |
          cd app && pnpm run typecheck
          cd ../pkg/ui && pnpm run tc

  build:
    name: Build
    runs-on: hanzo-build-linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # This job builds app AND pkg/ui, so build what BOTH depend on — the same
      # reason the typecheck job does. With only app's set built, pkg/ui's own
      # dependencies resolve to nothing:
      #   src/core/tokens.ts(33,8): error TS2307: Cannot find module
      #   '@hanzo/tokens' or its corresponding type declarations.
      # and the same for @hanzo/cd and @hanzo/products.
      - name: Build the workspace dependencies of app and pkg/ui
        run: pnpm turbo run build --filter='@hanzo/ui-web^...' --filter='@hanzo/ui^...'

      - name: Build UI package
        run: cd pkg/ui && pnpm run build

      - name: Build app
        run: cd app && pnpm run build
        env:
          NEXT_PUBLIC_APP_URL: https://ui.hanzo.ai

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            app/.next
            pkg/ui/dist

  test:
    name: Test
    runs-on: hanzo-build-linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run pkg/ui tests
        run: cd pkg/ui && pnpm test

      - name: Run app tests
        run: |
          if [ -f "app/package.json" ] && grep -q '"test"' app/package.json 2>/dev/null; then
            cd app && pnpm test || echo "No tests configured"
          else
            echo "No test script found"
          fi


  status:
    name: CI Status
    runs-on: hanzo-build-linux-amd64
    needs: [lint, typecheck, build, test]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "CI checks failed"
            exit 1
          else
            echo "All CI checks passed!"
          fi