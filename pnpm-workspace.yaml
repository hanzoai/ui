# esbuild's install script is what puts its platform binary in place, and the
# builds here run on it — a dependency that resolves but cannot transform is no
# use. pnpm 11 refuses an unapproved script fatally (strictDepBuilds defaults
# on) and it wrote this key unanswered, so the install stopped at
# ERR_PNPM_IGNORED_BUILDS before reading a manifest.
allowBuilds:
  '@swc/core': false
  core-js: false
  esbuild: true
  workerd: false

