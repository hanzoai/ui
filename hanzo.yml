# Canonical CI/CD config for hanzoai/ui, read by the hanzoai/ci reusable and
# platform.hanzo.ai.
#
# A library, not a container. Packages publish to npm from
# .github/workflows/publish.yml when a version is ahead of npmjs — the only
# thing here allowed to reach npmjs.
#
# NO `test:` BLOCK. The gate is .github/workflows/cicd.yml: it tests the
# packages a change touched and every package that depends on them, split
# across parallel legs (.github/workflows/test.yml, which publish.yml runs for
# what it releases), and the consumer suites only when what @hanzo/ui packs may
# have changed. One serial job cannot hold that inside five minutes: @hanzo/ui's
# 259 test files alone ran 657 s on six cores. cicd.yml calls the reusable with
# `tests: 'false'` once its own jobs passed, for the repository-wide checks and
# the site below.

# ui.hanzo.ai. Static documentation and interactive component catalog
# pre-rendered via One SSG in apps/ui.hanzo.ai. All 48 components and examples
# export to static HTML served directly by the ingress staticFiles middleware.
site:
  slug: ui
  dir: apps/ui.hanzo.ai/dist/client
  on: [main]
  build: pnpm --filter @hanzo/ui... build && pnpm --filter ui.hanzo.ai run build

